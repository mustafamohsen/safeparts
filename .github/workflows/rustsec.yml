name: rustsec audit

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/**/Cargo.toml'
      - 'desktop/src-tauri/Cargo.toml'
      - 'rustsec-policy.toml'
      - 'scripts/dev/rustsec_audit.py'
      - '.github/workflows/rustsec.yml'
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2

      - name: Enforce RustSec policy
        run: python3 scripts/dev/rustsec_audit.py
