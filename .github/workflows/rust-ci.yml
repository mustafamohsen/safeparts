name: rust ci

on:
  push:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'desktop/**'
      - 'scripts/dev/rust_coverage.py'
      - 'scripts/dev/workflow_policy.py'
      - 'scripts/dev/test_workflow_policy.py'
      - 'scripts/release/**'
      - 'mise.toml'
      - 'windows/global.json'
      - 'web/package.json'
      - 'web/scripts/test-wasm.sh'
      - '.github/workflows/rust-ci.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'desktop/**'
      - 'scripts/dev/rust_coverage.py'
      - 'scripts/dev/workflow_policy.py'
      - 'scripts/dev/test_workflow_policy.py'
      - 'scripts/release/**'
      - 'mise.toml'
      - 'windows/global.json'
      - 'web/package.json'
      - 'web/scripts/test-wasm.sh'
      - '.github/workflows/rust-ci.yml'
      - '.github/workflows/release.yml'

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check release workflow policy
        run: |
          python3 scripts/dev/test_workflow_policy.py
          python3 scripts/dev/workflow_policy.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
          targets: wasm32-unknown-unknown

      - name: Install Rust tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.0,wasm-pack@0.15.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install desktop frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: desktop

      - name: Test desktop recovery adapter
        run: bun run test:adapter
        working-directory: desktop

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            wget

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-features

      - name: WASM browser tests
        run: bash web/scripts/test-wasm.sh

      - name: Production-only coverage
        run: python3 scripts/dev/rust_coverage.py

      - name: Upload Rust coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: target/coverage
          if-no-files-found: warn
