name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string for naming (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate release version
        run: python3 scripts/release/check-version.py "${{ env.RELEASE_VERSION }}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-05)
        with:
          toolchain: '1.93.0'

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            wget

      - name: Test
        run: cargo test --all-features

  build:
    name: build (${{ matrix.id }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            id: linux
          - os: windows-2025
            id: windows
          - os: macos-14
            id: macos-x86_64
            target: x86_64-apple-darwin
            arch: x86_64
          - os: macos-14
            id: macos-aarch64
            target: aarch64-apple-darwin
            arch: aarch64

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-05)
        with:
          toolchain: '1.93.0'

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Rust target (if needed)
        if: matrix.target
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - name: Build release binaries
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release -p safeparts -p safeparts_tui --target ${{ matrix.target }}
          else
            cargo build --release -p safeparts -p safeparts_tui
          fi

      - name: Package
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            python scripts/release/package.py --version "${{ env.RELEASE_VERSION }}" --target "${{ matrix.target }}" --arch "${{ matrix.arch }}"
          else
            python scripts/release/package.py --version "${{ env.RELEASE_VERSION }}" --arch "${{ matrix.arch }}"
          fi

      - name: Upload packaged artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: safeparts-${{ matrix.id }}
          path: dist/release/*

  desktop:
    name: desktop (${{ matrix.id }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-desktop
            os: ubuntu-24.04
            bundles: appimage,deb,rpm
            artifact_name: safeparts-desktop-linux
            artifact_paths: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
          - id: windows-desktop
            os: windows-2025
            bundles: nsis,msi
            artifact_name: safeparts-desktop-windows
            artifact_paths: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/msi/*.msi
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-05)
        with:
          toolchain: '1.93.0'

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            rpm \
            wget

      - name: Install frontend dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Build desktop bundles
        working-directory: desktop
        shell: bash
        run: bun run tauri:build -- --ci --bundles "${{ matrix.bundles }}"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

  native-windows:
    name: native Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-2025
          - arch: arm64
            os: windows-11-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-05)
        with:
          toolchain: '1.93.0'

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.100'

      - name: Check generated native binding
        run: python windows/scripts/prepare.py --check

      - name: Test Windows application model
        working-directory: windows
        run: dotnet test Safeparts.AppModel.Tests/Safeparts.AppModel.Tests.csproj --configuration Release

      - name: Build interoperability smoke
        working-directory: windows
        run: dotnet build Safeparts.InteropSmoke/Safeparts.InteropSmoke.csproj --configuration Release

      - name: Package native Windows app
        run: python windows/scripts/package-release.py "${{ env.RELEASE_VERSION }}" "${{ matrix.arch }}"

      - name: Test exact native Windows package
        shell: pwsh
        run: |
          $version = "${{ env.RELEASE_VERSION }}".TrimStart('v')
          $package = (Resolve-Path "target/native-windows-release/${{ matrix.arch }}/extract/safeparts-native-windows-${{ matrix.arch }}-$version").Path
          windows/scripts/launch-package-smoke.ps1 -PackageRoot $package
          $env:SAFEPARTS_NATIVE_DIR = $package
          dotnet run --project windows/Safeparts.InteropSmoke/Safeparts.InteropSmoke.csproj --configuration Release --no-build

      - name: Test keyboard and UI Automation workflow
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $version = "${{ env.RELEASE_VERSION }}".TrimStart('v')
          $env:SAFEPARTS_APP_EXE = (Resolve-Path "target/native-windows-release/x64/extract/safeparts-native-windows-x64-$version/Safeparts.exe").Path
          dotnet test windows/Safeparts.UiAutomation.Tests/Safeparts.UiAutomation.Tests.csproj --configuration Release

      - name: Upload native Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: safeparts-native-windows-${{ matrix.arch }}
          path: dist/release/safeparts-native-windows-${{ matrix.arch }}-*.zip
          if-no-files-found: error

  native-macos:
    name: native macOS
    runs-on: macos-14
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode with Swift 6
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '16.2'

      - name: Verify Swift toolchain
        run: swift --version | grep -E 'Apple Swift version (6|[7-9]|[1-9][0-9])'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-05)
        with:
          toolchain: '1.93.0'

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test native app
        run: |
          macos/scripts/prepare.sh
          git diff --exit-code -- macos/Generated macos/Sources/SafepartsKit/Generated.swift
          swift build --package-path macos
          macos/scripts/verify-binary.sh
          swift test --package-path macos

      - name: Package unsigned universal native DMG
        run: macos/scripts/package-release.sh "${{ env.RELEASE_VERSION }}"

      - name: Upload native macOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: safeparts-native-macos-universal
          path: dist/release/safeparts-native-macos-universal-*.dmg
          if-no-files-found: error

  assemble:
    name: assemble
    runs-on: ubuntu-24.04
    needs:
      - build
      - desktop
      - native-macos
      - native-windows
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist/release
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          from pathlib import Path

          out_dir = Path('dist/release')
          published_suffixes = (
              '.tar.gz', '.zip', '.AppImage', '.deb', '.rpm', '.dmg', '.msi', '.exe'
          )
          files = sorted(
              p
              for p in out_dir.rglob('*')
              if p.is_file() and p.name.endswith(published_suffixes)
          )
          names = [p.name for p in files]
          if len(names) != len(set(names)):
              raise RuntimeError('published release asset names must be unique')

          def sha256_hex(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          sums = out_dir / 'SHA256SUMS.txt'
          with sums.open('w', encoding='utf-8') as f:
              for p in files:
                  f.write(f"{sha256_hex(p)}  {p.name}\n")
          print(f"wrote {sums}")
          PY

      - name: Upload assembled release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: safeparts-${{ github.event_name == 'workflow_dispatch' && 'release-dry-run' || 'release-candidate' }}-${{ env.RELEASE_VERSION }}
          path: dist/release
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    needs: assemble
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: safeparts-release-candidate-${{ env.RELEASE_VERSION }}
          path: dist/release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            dist/release/**/*.tar.gz
            dist/release/**/*.zip
            dist/release/**/*.AppImage
            dist/release/**/*.deb
            dist/release/**/*.rpm
            dist/release/**/*.dmg
            dist/release/**/*.msi
            dist/release/**/*.exe
            dist/release/SHA256SUMS.txt
