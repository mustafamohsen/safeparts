schema = 1

# Linux Tauri 2 currently uses the upstream GTK3 Rust bindings. These crates are
# unmaintained but are not reported as vulnerable or unsound by RustSec.
[[exceptions]]
advisories = [
  "RUSTSEC-2024-0411",
  "RUSTSEC-2024-0412",
  "RUSTSEC-2024-0413",
  "RUSTSEC-2024-0414",
  "RUSTSEC-2024-0415",
  "RUSTSEC-2024-0416",
  "RUSTSEC-2024-0417",
  "RUSTSEC-2024-0418",
  "RUSTSEC-2024-0419",
  "RUSTSEC-2024-0420",
]
category = "unmaintained"
package = "Tauri GTK3 bindings"
dependency_path = "safeparts_desktop -> tauri/wry -> gtk 0.18 -> atk/gdk GTK3 bindings"
exposure = "Linux desktop packaging and window integration only; no Safeparts secret-processing code calls these bindings directly."
constraint = "Tauri 2 and WebKitGTK 2 still depend on the GTK3 binding generation; migration requires an upstream Tauri/Wry GTK4 path."
owner = "Desktop maintainers"
review_by = "2026-11-30"

# This macro is reached only while compiling the same Linux GTK3 dependency path.
[[exceptions]]
advisories = ["RUSTSEC-2024-0370"]
category = "unmaintained"
package = "proc-macro-error"
dependency_path = "safeparts_desktop -> tauri/wry -> glib-macros/gtk3-macros -> proc-macro-error"
exposure = "Build-time procedural macro on the Linux desktop target; it is absent from runtime binaries."
constraint = "Removal depends on the upstream GTK3 macro stack or Tauri moving to newer GTK bindings."
owner = "Desktop maintainers"
review_by = "2026-11-30"

# urlpattern is used by Tauri configuration and runtime URL matching.
[[exceptions]]
advisories = [
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0098",
  "RUSTSEC-2025-0100",
]
category = "unmaintained"
package = "unic 0.9 family"
dependency_path = "safeparts_desktop -> tauri-utils -> urlpattern -> unic-ucd-ident -> unic 0.9 crates"
exposure = "Tauri URL-pattern parsing for local application configuration; Safeparts does not pass recovery shares or secrets into this parser."
constraint = "Tauri-utils currently selects urlpattern 0.3, whose Unicode identifier implementation uses the unmaintained unic 0.9 family."
owner = "Desktop maintainers"
review_by = "2026-11-30"

# Narrow Linux exception: the affected iterator API is not used by Safeparts,
# but Tauri's GTK3 dependency pins glib below the patched 0.20 line.
[[exceptions]]
advisories = ["RUSTSEC-2024-0429"]
category = "unsound"
package = "glib 0.18"
dependency_path = "safeparts_desktop -> tauri/wry -> gtk 0.18 -> glib 0.18"
exposure = "Linux desktop target only. Safeparts does not call VariantStrIter, the affected API; native macOS and Windows graphs do not include glib."
constraint = "The patched glib 0.20 API is incompatible with Tauri's current GTK3 stack; removal requires upstream Tauri/Wry migration."
owner = "Desktop maintainers"
review_by = "2026-11-30"
