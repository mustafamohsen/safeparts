[build]
  publish = "web/dist"
  # Cancel provider-initiated Git builds. Production is published only by the
  # tested-artifact deployment job in .github/workflows/web-ci.yml.
  ignore = "/bin/true"

[[redirects]]
  from = "/help"
  to = "/help/"
  status = 301

[[redirects]]
  from = "/help/ar"
  to = "/help/ar/"
  status = 301

[[redirects]]
  from = "/help/*"
  to = "/help/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
